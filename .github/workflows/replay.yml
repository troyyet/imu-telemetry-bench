name: Replay check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          cache-dependency-glob: replay_check.py
      - name: Compile the schema and replay partial USB reads
        run: uv run --script replay_check.py
